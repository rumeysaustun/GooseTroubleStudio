<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Olmayan adresler için. Cloudflare Pages bu dosyayı 404 durum koduyla sunar. -->
  <title>Sayfa bulunamadı — Goose Trouble Studio</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D0D0F">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=ec99492231">
  <style>
    .not-found {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: var(--gutter);
      text-align: center;
    }
    .not-found__inner { max-width: 520px; display: grid; justify-items: center; gap: 20px; }
    .not-found__badge { width: 180px; }
    .not-found__code { color: var(--orange); font-weight: var(--fw-display); letter-spacing: 0.2em; }
    .not-found__title { font-size: clamp(2rem, 6vw, 3rem); }
    .not-found__text { color: var(--text-muted); }
    .not-found__alt { color: var(--text-muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found__inner">
      <img class="not-found__badge" src="/assets/img/mascot-badge.webp" alt="" width="600" height="600">
      <p class="not-found__code">404</p>
      <h1 class="not-found__title">Bu dosya kayıp.</h1>
      <p class="not-found__text">Kaz her köşeye baktı ama aradığın sayfayı bulamadı.</p>
      <a class="btn btn--primary" href="/">Ana sayfaya dön</a>
      <p class="not-found__alt" lang="en">Page not found. <a href="/en/"><u>Back to home</u></a></p>
    </div>
  </main>
</body>
</html>
